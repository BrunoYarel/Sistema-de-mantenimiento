# docker/frontend/nginx.conf
# Un solo "sitio" para el navegador:
#   /        -> los archivos de frontend/ (html, css, js)
#   /api/... -> backend/public/index.php, que atiende PHP-FPM (contenedor "backend")
# Asi el login, la cookie de sesion y la defensa CSRF funcionan igual que en el servidor real.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: /api y todo lo que cuelga de /api lo atiende el backend.
    location ~ ^/api(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
        fastcgi_pass backend:9000;
    }

    # Archivos ocultos: nunca (igual que backend/public/.htaccess).
    location ~ /\. {
        deny all;
    }

    # Desarrollo: el navegador revalida siempre, asi ves tus cambios al recargar.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}